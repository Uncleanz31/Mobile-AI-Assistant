name: Generate Ready-to-Use APK

on:
  workflow_dispatch:

permissions:
  contents: write

# Silences the Node.js 20/24 deprecation warnings
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Submodules and Clone Exact llama.cpp
        run: |
          # 1. Fix .gitmodules so Git stops throwing errors during cleanup
          git config -f .gitmodules submodule.app/src/main/cpp/llama.cpp.url https://github.com/ggerganov/llama.cpp.git
          git config -f .gitmodules submodule.app/src/main/cpp/llama.cpp.path app/src/main/cpp/llama.cpp
          
          # 2. Find the exact llama.cpp commit the author used
          COMMIT_HASH=$(git ls-tree HEAD app/src/main/cpp/llama.cpp | awk '{print $3}')
          echo "Target llama.cpp commit: $COMMIT_HASH"
          
          # 3. Clone and checkout that exact version to prevent C++ build errors
          rm -rf app/src/main/cpp/llama.cpp
          git clone https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
          if [ -n "$COMMIT_HASH" ]; then
            cd app/src/main/cpp/llama.cpp
            git checkout $COMMIT_HASH
            cd ../../../..
          fi

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        # Uses the system gradle provided by the action above
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mobile-AI-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: Mobile AI Assistant APK
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
