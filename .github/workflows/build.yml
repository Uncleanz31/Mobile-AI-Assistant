name: Generate Ready-to-Use APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Matching llama.cpp Version and Gradle
        run: |
          # 1. Detect the exact commit of llama.cpp tracked by this repo
          COMMIT_HASH=$(git ls-tree HEAD app/src/main/cpp/llama.cpp | awk '{print $3}')
          echo "Target llama.cpp commit: $COMMIT_HASH"

          # 2. Clone llama.cpp and check out the matching commit
          rm -rf app/src/main/cpp/llama.cpp
          git clone https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
          if [ -n "$COMMIT_HASH" ]; then
            cd app/src/main/cpp/llama.cpp
            git checkout $COMMIT_HASH
            cd ../../../..
          fi

          # 3. Fix broken .gitmodules to avoid Git cleanup errors
          printf '[submodule "app/src/main/cpp/llama.cpp"]\n\tpath = app/src/main/cpp/llama.cpp\n\turl = https://github.com/ggerganov/llama.cpp.git\n' > .gitmodules

          # 4. Setup Gradle 8.4 wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-AI-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: Mobile AI Assistant APK
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
