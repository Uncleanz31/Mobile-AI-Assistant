name: Generate Ready-to-Use APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Setup Gradle 8.4 & llama.cpp Submodule
        run: |
          # 1. Fix missing git submodule URL and fetch exact commit
          git config submodule."app/src/main/cpp/llama.cpp".url https://github.com/ggerganov/llama.cpp.git
          git submodule update --init --recursive || (rm -rf app/src/main/cpp/llama.cpp && git clone --depth 50 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp)

          # 2. Download and install Gradle 8.4
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle wrapper --gradle-version 8.4
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Mobile-AI-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: Mobile AI Assistant APK
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
